<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="GCash QR placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EF9393"/>
      <stop offset="0.25" stop-color="#E17DC2"/>
      <stop offset="0.5" stop-color="#998EE0"/>
      <stop offset="0.75" stop-color="#43ADD0"/>
      <stop offset="1" stop-color="#8BDEDA"/>
    </linearGradient>
  </defs>
  <rect width="320" height="320" rx="24" fill="url(#bg)"/>
  <rect x="28" y="28" width="264" height="264" rx="16" fill="#ffffff"/>
  <g fill="#1c1330">
    <!-- Three finder markers, mimicking a QR shape. Replace this file with a real QR when you have it. -->
    <rect x="52" y="52" width="56" height="56" rx="6"/>
    <rect x="212" y="52" width="56" height="56" rx="6"/>
    <rect x="52" y="212" width="56" height="56" rx="6"/>
    <rect x="66" y="66" width="28" height="28" rx="3" fill="#ffffff"/>
    <rect x="226" y="66" width="28" height="28" rx="3" fill="#ffffff"/>
    <rect x="66" y="226" width="28" height="28" rx="3" fill="#ffffff"/>
    <rect x="74" y="74" width="12" height="12" rx="2"/>
    <rect x="234" y="74" width="12" height="12" rx="2"/>
    <rect x="74" y="234" width="12" height="12" rx="2"/>
    <!-- Some pseudo-modules so it reads as a QR at a glance. -->
    <rect x="128" y="52" width="12" height="12"/>
    <rect x="152" y="52" width="12" height="12"/>
    <rect x="176" y="76" width="12" height="12"/>
    <rect x="128" y="76" width="12" height="12"/>
    <rect x="200" y="128" width="12" height="12"/>
    <rect x="52" y="128" width="12" height="12"/>
    <rect x="76" y="128" width="12" height="12"/>
    <rect x="128" y="128" width="12" height="12"/>
    <rect x="152" y="128" width="12" height="12"/>
    <rect x="128" y="152" width="12" height="12"/>
    <rect x="152" y="176" width="12" height="12"/>
    <rect x="200" y="176" width="12" height="12"/>
    <rect x="224" y="200" width="12" height="12"/>
    <rect x="128" y="200" width="12" height="12"/>
    <rect x="176" y="224" width="12" height="12"/>
    <rect x="200" y="248" width="12" height="12"/>
    <rect x="224" y="128" width="12" height="12"/>
    <rect x="248" y="152" width="12" height="12"/>
    <rect x="152" y="224" width="12" height="12"/>
  </g>
  <text x="160" y="180" text-anchor="middle" font-family="ui-sans-serif,system-ui,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="700" fill="#7a3f78">Replace public/gcash-qr.svg</text>
  <text x="160" y="198" text-anchor="middle" font-family="ui-sans-serif,system-ui,Segoe UI,Roboto,sans-serif" font-size="11" fill="#7a6e8c">with your actual GCash QR</text>
</svg>
